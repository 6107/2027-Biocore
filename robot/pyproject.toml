#
# Use this configuration file to control what RobotPy packages are installed
# on your SystemCore
#
[project]
name = "2027-Biocore"
version = "0.1.0"
description = "Team 6107 FRC Robot Code"
readme = "README.md"
requires-python = ">=3.14"

[dependency-groups]
dev = ["lib_6107"]

[tool.uv.sources]
lib_6107 = {
   path = "../../lib_6107", editable = true
}

[tool.robotpy]

# Version of robotpy this project depends on
robotpy_version = "2027.0.0a7"

# Which optional robotpy components should be installed?
# -> equivalent to `pip install robotpy[extra1, ...]
components = [
    #"all",
    "apriltag",
    "commands2",
    # "romi",
    "cscore",
    "sim",
    # "xrp",
]

# Other pip packages to install, such as vendor packages (each element
# is equivalent to a line in requirements.txt)
requires = [
    #"robotpy-pathplannerlib==2026.1.2",
    #"photonlibpy==2026.3.2",
    #"limelightlib-python==0.9.6",
    "chardet== 7.3.0",
    "phoenix6==26.1.3",
    #"robotpy-rev==2026.0.4",
    #"robotpy-hal==2026.2.2",
]

# List of paths to include
include_paths = [
    "robot_2027",
    "deploy"
]
